[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pam-profiles"
version = "0.1.0"
description = "Display and audio profiles for GNOME: screens on/off, positions, primary screen, default audio output and input."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Kevin Willis" }]
dependencies = [
    # PulseAudio client API (libpulse via ctypes); talks to PipeWire through pipewire-pulse.
    "pulsectl>=24.0",
    # Gio D-Bus for org.gnome.Mutter.DisplayConfig and notifications. Usually the distro's
    # python3-gi; create the venv with --system-site-packages so pip sees it.
    "PyGObject>=3.42",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pam = "pam_profiles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
